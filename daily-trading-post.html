<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Trading Post Generator</title>
  <style>

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; background-color: #1a73e8; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #1557b0; }
    #result { margin-top: 20px; padding: 10px; border: 1px solid #ddd; display: none; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Daily Trading Post Generator</h2>
  <form id="tradingForm">
    <div class="form-group">
      <label for="ticker">Stock Ticker (e.g., $NVDA):</label>
      <input type="text" id="ticker" name="ticker" required>
    </div>
    <button type="submit">Generate Post</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById('tradingForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const ticker = document.getElementById('ticker').value.trim().toUpperCase(); // Convert to uppercase for consistency
      const now = new Date();
      const options = { timeZone: 'America/Chicago', hour12: true, hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' };
      const dateTime = now.toLocaleString('en-US', options).replace(/,/, '').replace(/(\d+)\/(\d+)\/(\d+)/, '$2/$1/$3');
      const generatedTime = now.toLocaleString('en-US', { timeZone: 'America/Chicago', hour12: true, hour: '2-digit', minute: '2-digit' }) + ' CDT';
      const bias = 'BULLISH'; // Default bias; adjust dynamically if needed
      const lastClose = '181.81'; // Updated from finance card prevDayClose
      const volume = '45M'; // Example data; update with real data if needed
      const support = '176.254 (Low)'; // Updated from finance card low
      const resistance = '182.951 (High)'; // Updated from finance card high
      const currentPrice = '182.874'; // Current price from finance card
      const entry = 'Break above 182.951 (High)';
      const target1 = '185.00 (1:2 RR)';
      const target2 = '187.00';
      const stopLoss = '180.18 (Open)';
      const risk = '0.5% of Account';

      const post = `
🚨 **DAILY DAY TRADE PICK: ${ticker}** 📱
📅 ${dateTime} CDT | Bias: ${bias} 📈

🔍 **Pre-Market Snapshot:**
  - Last Close: $${lastClose}
  - Volume: ${volume}
  - Support: $${support}
  - Resistance: $${resistance}

📊 **Quick Setup:**
  • Current Price: $${currentPrice}
  • Entry: ${entry}
  • Targets: $${target1} | $${target2}
  • Stop Loss: $${stopLoss}
  • Risk: ${risk} | Why? Market Momentum

⚠️ **Risk Note:** Never risk >1% per trade. Watch $SPY for confirmation.

💬 **What’s your play on ${ticker} today? Drop your entry below!** 👇
📢 *Data generated at ${generatedTime}. Not financial advice. DYOR & trade responsibly. Follow for tomorrow’s pick! #DayTrading #StockTips*
`;

      const resultDiv = document.getElementById('result');
      resultDiv.textContent = post;
      resultDiv.style.display = 'block';

      // Copy to clipboard
      navigator.clipboard.writeText(post).then(() => {
        alert('Post copied to clipboard! Paste it into Facebook.');
      }).catch(err => {
        console.error('Failed to copy: ', err);
      });
    });
  </script>
