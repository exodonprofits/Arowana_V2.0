<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🧠 AI Option Strategy Advisor</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9fafb;
      margin: 0;
      padding: 0;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background-color: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: relative;
    }

    .logo {
      width: 100px;
      height: 100px;
    }

    .hamburger {
      display: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #2c3e50;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items:center;
      margin-right: 1rem;
    }

    .nav-links a {
      text-decoration: none;
      color: #0f172a;
      font-weight: 500;
    }

    .dropdown {
      position: relative;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 0.5rem 0;
      top: 100%;
      left: 0;
      z-index: 1000;
    }

    .dropdown-content a {
      display: block;
      padding: 0.5rem 1.25rem;
      color: #0f172a;
      text-decoration: none;
      white-space: nowrap;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    @media (max-width: 768px) {
      .hamburger {
        display: block;
      }

      .nav-links {
        display: none;
        flex-direction: column;
        background-color: #ffffff;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        padding: 1rem 5%;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        z-index: 999;
      }

      .nav-links.open {
        display: flex;
      }

      .dropdown-content {
        position: relative;
        box-shadow: none;
      }

      .dropdown:hover .dropdown-content {
        display: block;
      }
    }

    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    h1 {
      text-align: center;
      color: #2563eb;
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 1rem;
    }

    input, select, button {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      margin-top: 0.25rem;
      box-sizing: border-box;
    }

    button {
      background-color: #2563eb;
      color: white;
      font-weight: 600;
      margin-top: 1.5rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.875rem;
      color: #64748b;
    }

    #result {
      margin-top: 2rem;
      background: #f1f5f9;
      padding: 1rem;
      border-radius: 0.75rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- ✅ Responsive Navbar -->
  <nav class="navbar">
    <div><img src="images/arowanalogo.png" class="logo"/></div>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="#services">Services</a>
      <div class="dropdown">
        <a href="#tools">Trading Tools ▾</a>
        <div class="dropdown-content">
          <a href="stocks-screener.html">Stock Screener</a>
          <a href="portfolio-analyzer.html">Portfolio Analyzer</a>
          <a href="option-trader.html">Option Advisor</a>
        </div>
      </div>
      <a href="contact.htm">Contact</a>
    </div>
  </nav>

  <!-- 🧠 Options Strategy Advisor Tool -->
  <div class="container">
    <h1>🧠 AI Option Strategy Advisor</h1>

    <label for="ticker">Ticker Symbol</label>
    <input type="text" id="ticker" placeholder="e.g., AAPL" />

    <label for="bias">Market Bias</label>
    <select id="bias">
      <option value="neutral">Neutral</option>
      <option value="bullish">Bullish</option>
      <option value="bearish">Bearish</option>
    </select>

    <label for="risk">Risk Tolerance</label>
    <select id="risk">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>

    <label for="goal">Trading Goal</label>
    <select id="goal">
      <option value="income">Generate Income</option>
      <option value="speculate">Speculate on Price</option>
      <option value="hedge">Hedge Position</option>
    </select>

    <button onclick="getStrategy()">🎯 Get Strategy</button>

    <div id="result"></div>
  </div>

  <div class="footer">
    © 2025 Arowana Profits. All strategies are for educational use only.
  </div>

  <!-- ✅ Hamburger Toggle Script -->
  <script>
    function toggleMenu() {
      document.getElementById("navLinks").classList.toggle("open");
    }

    function getStrategy() {
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      const bias = document.getElementById("bias").value;
      const risk = document.getElementById("risk").value;
      const goal = document.getElementById("goal").value;

      const resultBox = document.getElementById("result");
      resultBox.innerHTML = `📝 Strategy Suggestion for <strong>${ticker}</strong><br>
      • Market Bias: ${bias}<br>
      • Risk Level: ${risk}<br>
      • Goal: ${goal}<br><br>
      🤖 Try a <strong>Cash-Secured Put</strong> or <strong>Covered Call</strong> if your bias is bullish and your goal is income.`;
      resultBox.style.display = 'block';
    }
  </script>

</body>
</html>
