<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trade Ideas AI • GenieSphere</title>
  <style>
    :root{
      --bg:#f9fafb; --card:#ffffff; --ink:#0f172a; --muted:#6b7280; --ring:#d1d5db;
      --brand:#0ea5e9; --brand-strong:#0284c7; --accent:#22c55e; --danger:#ef4444; --warn:#f59e0b;
      --soft:rgba(0,0,0,.06); --radius-lg:1.25rem; --radius-sm:.625rem; --shadow:0 8px 24px rgba(0,0,0,.08); --shadow-soft:0 4px 14px rgba(0,0,0,.07); --focus:0 0 0 4px rgba(14,165,233,.25);
      --font:'Segoe UI', system-ui, -apple-system, "Inter", Roboto, Helvetica, Arial, sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;min-height:100vh}
    .wrap{width:100%;max-width:1100px;margin:0 auto;padding:1.25rem}

    header{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:1rem 0 1.25rem;flex-wrap:wrap}
    .title{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
    .title h1{margin:0;font-size:clamp(1.3rem,2.4vw,1.9rem);font-weight:800}
    .title .sub{color:var(--muted);font-size:.95rem}

    .grid{display:grid;gap:1rem;grid-template-columns:1fr}
    .card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:1.25rem}
    .card h2{margin:0 0 .75rem;font-size:1.05rem}
    .sep{height:1px;background:var(--ring);opacity:.5;margin:.75rem 0 1rem}

    form{display:grid;gap:1rem}
    label{font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:.5rem}
    input,select{width:100%;background:#fff;border:1px solid var(--ring);border-radius:var(--radius-sm);padding:.75rem;font-size:1rem}
    input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:var(--focus)}

    .actions{display:flex;flex-wrap:wrap;gap:.75rem}
    .btn{appearance:none;border:0;cursor:pointer;padding:.8rem 1.25rem;font-weight:700;border-radius:999px;box-shadow:var(--shadow-soft);display:inline-flex;align-items:center;gap:.55rem}
    .btn.primary{background:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-strong)}
    .btn.gray{background:#e5e7eb;color:#111827}.btn.gray:hover{background:#d1d5db}
    .btn.warn{background:var(--warn);color:#111827}
    .btn.link{background:transparent;box-shadow:none;color:var(--brand-strong)}

    .spinner{display:none;margin-top:.75rem;text-align:center}
    .spinner .dot{width:36px;height:36px;border-radius:50%;border:4px solid #e5e7eb;border-top-color:var(--brand);margin:0 auto;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .note{background:#ecfeff;border-left:4px solid var(--brand);padding:.8rem;border-radius:.5rem}
    .error{background:#fee2e2;border-left:4px solid var(--danger);padding:.8rem;border-radius:.5rem;color:#991b1b}
    .success{background:#ecfdf5;border-left:4px solid var(--accent);padding:.8rem;border-radius:.5rem;color:#065f46}

    footer{margin:1.5rem 0 2.5rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>🧠 Trade Ideas AI</h1>
        <span class="sub">AI-powered daily stock trade ideas and rationale</span>
      </div>
      <nav><a class="btn link" href="short-term-dashboard.html">⬅️ Back</a></nav>
    </header>

    <div class="grid">
      <section class="card">
        <h2>⚙️ Idea Generator</h2>
        <form id="ideaForm">
          <label for="sector">📊 Sector</label>
          <select id="sector">
            <option value="any">Any</option>
            <option value="tech">Technology</option>
            <option value="health">Healthcare</option>
            <option value="finance">Finance</option>
            <option value="energy">Energy</option>
          </select>

          <label for="style">⚡ Strategy</label>
          <select id="style">
            <option value="swing">Swing</option>
            <option value="day">Day Trade</option>
            <option value="long">Long-term</option>
          </select>

          <div class="actions">
            <button type="submit" class="btn primary">🚀 Generate Ideas</button>
            <button type="reset" class="btn warn">🔄 Reset</button>
          </div>
          <div class="spinner" id="busy"><div class="dot"></div></div>
        </form>
      </section>

      <section class="card" id="results">
        <h2>📋 Results</h2>
        <div id="ideasBody">
          <div class="note">Generate to see AI trade ideas.</div>
        </div>
      </section>
    </div>

    <footer>
      <div>GenieSphere • Trade Ideas AI</div>
      <div><a class="btn link" href="short-term-dashboard.html">⬅️ Back to Dashboard</a></div>
    </footer>
  </div>

  <script>
    const $ = id=>document.getElementById(id);

    function setBusy(on){ $("busy").style.display = on?'block':'none'; }

    async function generateIdeas(e){
      e.preventDefault();
      setBusy(true);
      const sector = $("sector").value;
      const style = $("style").value;
      try{
        // Demo mock data. Replace with fetch to n8n or OpenAI agent.
        await new Promise(r=>setTimeout(r,800));
        const ideas = [
          {ticker:"AAPL", reason:"Strong momentum in tech with solid earnings.", type:style},
          {ticker:"XOM", reason:"Energy demand surge; sector rotation.", type:style},
          {ticker:"JPM", reason:"Financial sector stability with rate outlook.", type:style}
        ];
        const html = ideas.map(i=>`<div class="success"><strong>${i.ticker}</strong> – ${i.reason} <span class="muted">(${i.type})</span></div>`).join("");
        $("ideasBody").innerHTML = html;
      }catch(err){
        $("ideasBody").innerHTML = `<div class='error'>❌ ${err.message}</div>`;
      }finally{ setBusy(false); }
    }

    $("ideaForm").addEventListener('submit',generateIdeas);
  </script>
</body>
</html>
