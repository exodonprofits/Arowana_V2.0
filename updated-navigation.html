<style>

<!-- Enhanced Navigation JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Analysis Tools Dropdown
  const analysisDropdown = document.getElementById('analysisDropdown');
  const analysisDropdownMenu = document.getElementById('analysisDropdownMenu');
  const dropdown = analysisDropdown.closest('.nav-dropdown');
  
  if (analysisDropdown && dropdown) {
    // Toggle dropdown on click
    analysisDropdown.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      dropdown.classList.toggle('open');
    });
    
    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      if (!dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });
    
    // Close dropdown when pressing Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        dropdown.classList.remove('open');
      }
    });
  }
  
  // Update navigation based on current page
  updateActiveNavigation();
  
  // Update authentication UI
  updateAuthenticationUI();
});

function updateActiveNavigation() {
  const currentPage = window.location.pathname.split('/').pop();
  const navLinks = document.querySelectorAll('.nav-link, .nav-dropdown-item');
  
  navLinks.forEach(link => {
    link.classList.remove('active');
    const href = link.getAttribute('href');
    if (href && (href === currentPage || (currentPage === '' && href === 'index.html'))) {
      link.classList.add('active');
      
      // If it's a dropdown item, also show the parent dropdown as active
      if (link.classList.contains('nav-dropdown-item')) {
        const parentDropdown = link.closest('.nav-dropdown');
        if (parentDropdown) {
          parentDropdown.querySelector('.dropdown-toggle').classList.add('active');
        }
      }
    }
  });
}

function updateAuthenticationUI() {
  try {
    const currentUser = JSON.parse(localStorage.getItem('gs_auth_user_v1') || '{}');
    const signInBtn = document.getElementById('signInBtn');
    const startFreeBtn = document.getElementById('startFreeBtn');
    
    if (currentUser && currentUser.email) {
      // User is logged in
      if (signInBtn) {
        signInBtn.textContent = '👤 Account';
        signInBtn.onclick = () => location.href = 'account.html';
      }
      
      if (startFreeBtn) {
        startFreeBtn.textContent = '📊 Dashboard';
        startFreeBtn.onclick = () => location.href = 'trading-command.html';
      }
    }
  } catch (error) {
    console.log('Authentication UI update failed:', error);
  }
}

// Make dropdown functions globally available
window.updateActiveNavigation = updateActiveNavigation;
window.updateAuthenticationUI = updateAuthenticationUI;
</script>
