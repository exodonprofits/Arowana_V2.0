<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="robots" content="noindex">
  <!-- An OAuth return URL can carry a code; never send it on as a referrer. -->
  <meta name="referrer" content="no-referrer">
  <title>Schwab connection coming soon — Arowana Profits</title>
  <!-- Schwab OAuth return page. The schwab-auth-callback function it posted to
       was never deployed, and the old script imported a path outside the site
       root, so no connection could complete. Until Schwab sync is built this
       page only says so: it reads nothing, sends nothing, and removes any
       code/state from the address bar. -->
  <script>
    if (location.search) history.replaceState(null, '', location.pathname);
  </script>
  <style>
    body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;margin:0;padding:24px 16px;background:#f9fafb;color:#111827}
    .card{max-width:620px;margin:40px auto 0;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:24px}
    h1{margin:0 0 10px;font-size:1.4rem}
    p{color:#475569;line-height:1.6;margin:0 0 12px}
    a{color:#1d4ed8;font-weight:700;text-decoration:none}
    a:hover{text-decoration:underline}
    .links{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:6px}
  </style>
  <!-- Home-screen app (ATD-109): installable from the browser's share menu; opens full screen, without the address bar. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#071a2f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Arowana">
  <link rel="apple-touch-icon" href="images/app-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <h1>🏦 Schwab connection is coming soon</h1>
    <p>Connecting a Charles Schwab account is not available yet, so nothing was connected and no account details were stored.</p>
    <p>Until then, export your trades from Schwab as CSV and import them into your Trade Journal.</p>
    <div class="links">
      <a href="trade-journal-pro.html?action=import">Import a CSV into your journal</a>
      <a href="broker-connections.html">Broker Connections</a>
    </div>
  </div>
</body>
</html>
