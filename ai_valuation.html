<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 AI Valuation Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <script defer src="valuation-logic.js"></script>
  <style>
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.25rem;
      background: linear-gradient(45deg, #2BFFD9, #7C3AED);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .form-section {
      max-width: 500px;
      margin: 2rem auto;
      background: rgba(255, 255, 255, 0.05);
      padding: 2rem;
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    label {
      display: block;
      text-align: left;
      margin-bottom: 0.25rem;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 0.75rem;
      border: none;
      background-color: #1E293B;
      color: white;
    }
    button {
      background-color: #2BFFD9;
      color: #0F172A;
      font-weight: bold;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      opacity: 0.9;
    }
    .result {
      margin-top: 2rem;
      padding: 1.5rem;
      background-color: #1E293B;
      border-radius: 1rem;
    }
    .back-button {
      margin-top: 2rem;
      display: inline-block;
      background: linear-gradient(45deg, #2BFFD9, #7C3AED);
      color: #0F172A;
      padding: 0.6rem 1.5rem;
      border-radius: 1rem;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>📊 AI Valuation Engine</h1>
  <div class="form-section">
    <label for="ticker">🔍 Stock Ticker</label>
    <input type="text" id="ticker" placeholder="e.g. AAPL" />

    <label for="method">📐 Valuation Method</label>
    <select id="method">
      <option value="dcf">Discounted Cash Flow (DCF)</option>
      <option value="eps">EPS Multiple</option>
      <option value="book">Book Value</option>
    </select>

    <button onclick="runValuation()">💡 Run Valuation</button>
  </div>
  <div id="result" class="result" style="display:none"></div>

  <a class="back-button" href="investment.html">⬅️ Back to Investment</a>
</body>
</html>
