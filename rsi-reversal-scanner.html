<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Scanners — Arowana Profits</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=scanner.html?scan=rsi_reversal">
  <!-- ATD-009 phase 2: retired standalone scanner. Keeps the old URL working;
       any query string and hash are carried over to scanner.html?scan=rsi_reversal. -->
  <script>
    var extra = window.location.search ? '&' + window.location.search.slice(1) : '';
    window.location.replace('scanner.html?scan=rsi_reversal' + extra + window.location.hash);
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #f8fafc; color: #1e293b; padding: 60px 20px; text-align: center; margin: 0; }

    h1 { color: #0b4f8a; margin-bottom: 12px; font-size: 1.4rem; }
    p { color: #64748b; line-height: 1.6; margin-bottom: 16px; }
    a { color: #0b4f8a; font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
  <!-- Home-screen app (ATD-109): installable from the browser's share menu; opens full screen, without the address bar. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#071a2f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Arowana">

</head>

  </div>
</body>
</html>
