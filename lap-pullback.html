<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CLAP Pullback • GenieSphere</title>
  <style>
    :root{
      --bg:#f9fafb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--ring:#d1d5db;
      --brand:#0ea5e9;--brand-strong:#0284c7;--accent:#22c55e;--danger:#ef4444;--warn:#f59e0b;
      --radius-lg:1.25rem;--radius-sm:.625rem;--shadow:0 8px 24px rgba(0,0,0,.08);
      --shadow-soft:0 4px 14px rgba(0,0,0,.07);--focus:0 0 0 4px rgba(14,165,233,.25);
      --font:'Segoe UI',system-ui,"Inter",Roboto,Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;min-height:100vh}
    .wrap{max-width:1100px;margin:auto;padding:1.25rem;width:100%}
    header{display:flex;justify-content:space-between;align-items:center;margin:1rem 0 1.25rem}
    .title{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
    .title h1{margin:0;font-size:clamp(1.3rem,2.4vw,1.9rem);font-weight:800}
    .title .sub{color:var(--muted);font-size:.95rem}
    .back{color:var(--brand-strong);text-decoration:none;font-weight:700;display:flex;align-items:center;gap:.5rem}
    .card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:1.25rem;margin-bottom:1rem}
    h2{margin:0 0 .75rem}
    label{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:.4rem}
    input,select{width:100%;padding:.75rem;border:1px solid var(--ring);border-radius:var(--radius-sm);font-size:1rem}
    input:focus,select:focus{border-color:var(--brand);box-shadow:var(--focus);outline:none}
    .row{display:grid;gap:.85rem}
    @media(min-width:600px){.row.two{grid-template-columns:1fr 1fr}}
    .actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:.5rem}
    .btn{border:0;border-radius:999px;padding:.8rem 1.25rem;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:.55rem;box-shadow:var(--shadow-soft)}
    .btn.primary{background:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-strong)}
    .btn.warn{background:var(--warn)}.btn.warn:hover{background:#fbbf24}
    .btn.link{background:none;color:var(--brand-strong)}
    .spinner{display:none;text-align:center;margin-top:.75rem}
    .spinner .dot{width:36px;height:36px;border-radius:50%;border:4px solid #e5e7eb;border-top-color:var(--brand);animation:spin 1s linear infinite;margin:auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .gauge-wrap{display:flex;flex-direction:column;align-items:center}
    .gauge{position:relative;width:320px;height:190px;margin:4px auto 0}
    .needle{position:absolute;bottom:30px;left:50%;width:6px;height:100px;background:var(--brand-strong);border-radius:3px;transform-origin:bottom center;transform:rotate(0deg);box-shadow:0 2px 10px rgba(0,0,0,.15)}
    .labels{display:flex;justify-content:space-between;max-width:320px;margin:8px auto 0;font-size:.8rem;font-weight:700;color:#0f172a}
    .stat{background:#f8fafc;border:1px solid var(--ring);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:.5rem}
    .stat .k{color:var(--muted);font-size:.85rem}.stat .v{font-weight:800}
    .note,.error,.success{padding:.8rem .9rem;border-radius:.5rem;margin-top:.75rem}
    .note{background:#ecfeff;border-left:4px solid var(--brand)}
    .error{background:#fff7ed;border-left:4px solid #f59e0b;color:#92400e}
    .success{background:#ecfdf5;border-left:4px solid #22c55e;color:#065f46}
    footer{margin:1.5rem 0 2.5rem;display:flex;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>📉 CLAP Pullback Scanner</h1>
        <span class="sub">Detect controlled pullbacks after a strong leg (Breakout/Fade aware).</span>
      </div>
      <nav><a href="short-term-dashboard.html" class="back">⬅️ Back</a></nav>
    </header>

    <section class="card">
      <h2>⚙️ Settings</h2>
      <form id="clapForm">
        <div class="row two">
          <div>
            <label>🔤 Stock Ticker</label>
            <input id="ticker" type="text" placeholder="e.g. TSLA or NVDA"/>
          </div>
          <div>
            <label>🕒 Timeframe</label>
            <select id="timeframe">
              <option value="1m">1 Min</option>
              <option value="5m" selected>5 Min</option>
              <option value="15m">15 Min</option>
              <option value="1h">1 Hour</option>
            </select>
          </div>
        </div>
        <div class="row two">
          <div>
            <label>↩️ Pullback Depth</label>
            <select id="depth">
              <option value="0.236">Shallow (≈23.6%)</option>
              <option value="0.382" selected>Moderate (≈38.2%)</option>
              <option value="0.5">Mid (50%)</option>
              <option value="0.618">Deep (≈61.8%)</option>
            </select>
          </div>
          <div>
            <label>🎯 Strategy</label>
            <select id="strategy">
              <option value="breakout" selected>Breakout Pullback (trend-cont.)</option>
              <option value="fade">Fade Pullback (counter-trend)</option>
              <option value="both">Both</option>
            </select>
          </div>
        </div>
        <div class="row two">
          <label><input type="checkbox" id="volConfirm"/> 📈 Volume Confirmation</label>
          <label><input type="checkbox" id="rsiConfirm"/> 💪 RSI Confirmation</label>
        </div>
        <div class="row two">
          <label><input type="checkbox" id="deepMode"/> 🧠 Deep AI Mode</label>
          <label><input type="checkbox" id="mockMode"/> 🧪 Demo Mode</label>
        </div>
        <div class="actions">
          <button class="btn primary" type="submit">🔎 Scan Pullback</button>
          <button class="btn warn" type="reset">🔄 Reset</button>
          <button class="btn link" type="button" id="copyBtn">📋 Copy Result</button>
        </div>
        <div class="spinner" id="spinner"><div class="dot"></div></div>
      </form>
    </section>

    <section class="card" id="resultCard">
      <h2>📋 Result</h2>
      <div class="gauge-wrap">
        <div class="gauge">
          <svg width="320" height="190" viewBox="0 0 320 190">
            <defs><linearGradient id="gaugeGradient" x1="0%" y1="100%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ef4444"/><stop offset="25%" stop-color="#fca5a5"/>
              <stop offset="50%" stop-color="#c7d2fe"/><stop offset="75%" stop-color="#86efac"/>
              <stop offset="100%" stop-color="#22c55e"/>
            </linearGradient></defs>
            <path d="M 20 170 A 140 140 0 0 1 300 170" stroke="url(#gaugeGradient)" stroke-width="20" fill="none"/>
          </svg>
          <div id="needle" class="needle"></div>
        </div>
        <div class="labels"><span>Bearish Fade</span><span>Sell</span><span>Neutral</span><span>Buy</span><span>Bullish Breakout</span></div>
      </div>
      <div id="resultBody" style="margin-top:14px">
        <div class="note">Run scan to see CLAP Pullback analysis.</div>
      </div>
    </section>

    <footer>
      <div>GenieSphere • CLAP Pullback</div>
      <div><a class="back" href="short-term-dashboard.html">⬅️ Back to Dashboard</a></div>
    </footer>
  </div>

  <script>
    // Connect to your n8n webhook for CLAP Pullback
    const WEBHOOK_URL = "https://exodonprofits.app.n8n.cloud/webhook/clap-pullback";
    const $ = (id)=>document.getElementById(id);
    const angleMap = {"bearish fade":-90,"sell":-45,"neutral":0,"buy":45,"bullish breakout":90};

    function rotateNeedle(signal){
      const key = String(signal||'neutral').toLowerCase();
      $("needle").style.transform = `rotate(${angleMap[key]||0}deg)`;
    }
    function setBusy(on){$("spinner").style.display = on?"block":"none";}
    function setResult(html,cls){const el=$("resultBody");el.innerHTML=html;if(cls)el.firstElementChild?.classList?.add(cls);}
    function toPrice(n){const v=Number(n);return isFinite(v)?`$${v.toFixed(2)}`:"--";}

    async function runScan(e){
      e?.preventDefault();
      const payload = {
        ticker: $("ticker").value.trim().toUpperCase(),
        timeframe: $("timeframe").value,
        depth: $("depth").value,
        strategy: $("strategy").value,
        confirms: { volume: $("volConfirm").checked, rsi: $("rsiConfirm").checked },
        deep: $("deepMode").checked
      };
      if(!payload.ticker){ setResult('<div class="error">Enter a ticker.</div>'); return; }
      setBusy(true);
      try{
        let data;
        const mock = $("mockMode").checked || !WEBHOOK_URL;
        if(mock){
          await new Promise(r=>setTimeout(r,700));
          data = {
            signal:"Buy",
            entry: 102.40,
            target: 106.80,
            stop: 100.20,
            trend:"Uptrend",
            reason:"Shallow 38.2% pullback with decreasing volume and RSI holding >50."
          };
        }else{
          const res = await fetch(WEBHOOK_URL,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify(payload)
          });
          if(!res.ok) throw new Error('Network error: '+res.status);
          data = await res.json();
        }
        rotateNeedle(data.signal);
        const html = `
          <div class="success">✅ ${data.signal||'Signal detected'}</div>
          <div class="stat"><div class="k">Entry</div><div class="v">${toPrice(data.entry)}</div></div>
          <div class="stat"><div class="k">Target</div><div class="v">${toPrice(data.target)}</div></div>
          <div class="stat"><div class="k">Stop</div><div class="v">${toPrice(data.stop)}</div></div>
          <div class="stat"><div class="k">Trend</div><div class="v">${data.trend||''}</div></div>
          <div class="note">${data.reason||'Reasoning unavailable.'}</div>`;
        setResult(html);
        validateSignalLogic(data);
      }catch(err){
        setResult(`<div class="error">❌ ${err.message||err}</div>`);
      }finally{ setBusy(false); }
    }

    function copyResult(){
      const txt = $("resultBody").innerText.trim();
      if(!txt) return;
      navigator.clipboard.writeText(txt).then(()=>{
        const el=document.createElement('div');
        el.className='success'; el.textContent='Copied to clipboard.'; $("resultBody").prepend(el);
        setTimeout(()=>el.remove(),1200);
      });
    }

    // === Smart Consistency Validator (same as your other tools) ===
    function validateSignalLogic(data){
      const s=(data.signal||"").toUpperCase();
      const e=Number(data.entry), t=Number(data.target), sl=Number(data.stop);
      let warnings=[], suggestion=null;
      const resultBody=$("resultBody");
      const cells=resultBody.querySelectorAll(".stat .k, td");
      const highlight=(label)=>{
        cells.forEach((el)=>{
          if(el.textContent.trim().toLowerCase().includes(label.toLowerCase())){
            const vCell=el.parentElement.querySelector(".v")||el.nextElementSibling;
            if(vCell) vCell.style.background="rgba(245,158,11,0.15)";
          }
        });
      };

      if(s.includes("BUY")||s.includes("BREAKOUT")){
        if(t<=e){warnings.push("⚠️ Target should be higher than entry for BUY/Breakout.");highlight("target");}
        if(sl>=e){warnings.push("⚠️ Stop should be below entry for BUY/Breakout.");highlight("stop");}
        if(t<e && sl>e) suggestion="SELL/Fade";
      }
      if(s.includes("SELL")||s.includes("FADE")){
        if(e<=t){warnings.push("⚠️ Entry should be higher than target for SELL/Fade.");highlight("entry");highlight("target");}
        if(sl<=e){warnings.push("⚠️ Stop should be above entry for SELL/Fade.");highlight("stop");}
        if(t>e && sl<e) suggestion="BUY/Breakout";
      }

      if(warnings.length||suggestion){
        let html="";
        if(warnings.length) html+=`<div class="error">${warnings.join("<br>")}</div>`;
        if(suggestion) html+=`<div class="success" style="margin-top:.5rem;">🤖 Suggested correction: <strong>${suggestion}</strong> (based on price relationships)</div>`;
        resultBody.insertAdjacentHTML("beforeend",html);
      }
    }

    $("clapForm").addEventListener("submit",runScan);
    $("copyBtn").addEventListener("click",copyResult);
    $("clapForm").addEventListener("reset",()=>setTimeout(()=>setResult('<div class="note">Run scan to see CLAP Pullback analysis.</div>')));
    rotateNeedle("neutral");
  </script>
</body>
</html>
