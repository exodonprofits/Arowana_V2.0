name: Node Tests

# ATD-108 decision Q2: unit tests for pure browser modules (js/*.js that also
# export to node). Uses Node's built-in test runner; no packages are installed.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
